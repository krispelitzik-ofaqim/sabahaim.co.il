<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הזמנות · הצופן הסודי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
:root{
  --ink:#1A2230; --soft:#55607180; --muted:#78828F; --paper:#F7F6F3; --card:#FFFFFF;
  --line:#E6E3DC; --gold:#B8862B; --red:#C0392B; --green:#2E7D5F; --wash:#F1EEE8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Heebo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;
  padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{margin:0;font-size:16px;font-weight:800}
.bar .count{font-size:12.5px;color:#9FA9B8;font-weight:600}
.bar .right{margin-inline-start:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.bar button{background:#2E3B4E;color:#fff;border:0;border-radius:10px;padding:8px 15px;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.bar button:hover{background:var(--gold)}
.bar button[disabled]{opacity:.5;cursor:default}
.bar .sync{font-size:11.5px;color:#9FA9B8}

.wrap{max-width:1180px;margin:0 auto;padding:18px}

.gate{max-width:360px;margin:16vh auto;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:26px}
.gate h2{margin:0 0 6px;font-size:19px;font-weight:800}
.gate p{margin:0 0 16px;font-size:13.5px;color:var(--muted);line-height:1.6}
.gate input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 14px;
  font-family:inherit;font-size:15px;margin-bottom:11px}
.gate button{width:100%;background:var(--ink);color:#fff;border:0;border-radius:11px;
  padding:13px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}
.gate .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.filters button{background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:7px 15px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink);
  cursor:pointer}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.filters button em{font-style:normal;color:var(--muted);margin-inline-start:5px}
.filters button.on em{color:#9FA9B8}

.order{background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin-bottom:8px;overflow:hidden}
.order.needPhone{border-color:#E7B4AD}
/* נמסר — נגמר, ולכן דהוי */
.order.done{background:#F4F8F5;border-color:#D6E6DB}
.order.done .head{opacity:.62}
.order.done .no{background:var(--green)}
.order.done:hover .head{opacity:1}
.order:hover{box-shadow:inset 0 0 0 1px var(--line)}

.head{display:flex;align-items:center;gap:11px;width:100%;
  padding:13px 15px;font-family:inherit;cursor:pointer;text-align:start;flex-wrap:wrap}
/* ארבעת השלבים על השורה עצמה — אין צורך לפתוח כדי לסמן שנשלח */
.steps{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.step{background:var(--card);border:0;border-inline-end:1px solid var(--line);
  padding:6px 11px;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);
  cursor:pointer;white-space:nowrap}
.step:last-child{border-inline-end:0}
.step:hover{background:var(--wash);color:var(--ink)}
.step.on{color:#fff}
.step.on.st-new{background:var(--gold)}
.step.on.st-packed{background:#2E6B8E}
.step.on.st-sent{background:#2E7D5F}
.step.on.st-done{background:#6B7A85}
.head:hover{background:var(--wash)}
.no{background:var(--ink);color:#fff;border-radius:8px;padding:3px 9px;flex:none;
  font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.who{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
.city{font-size:13px;color:var(--muted);white-space:nowrap}
.badge{flex:none;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 10px;
  background:var(--wash)}
.badge.bad{background:#FBE7E4;color:#9E2B1E}
.badge.printed{background:#E8EEF4;color:#2E5B7E}
.sum{margin-inline-start:auto;font-size:14px;font-weight:800;flex:none;
  font-variant-numeric:tabular-nums}
.chev{flex:none;font-size:11px;color:var(--muted);transition:transform .18s}
.order.open .chev{transform:rotate(180deg)}

.order .body{display:none;padding:0 15px 14px;border-top:1px solid var(--line)}
.order.open .body{display:block}

.lines{margin-top:11px;display:grid;gap:3px;font-size:13.5px;color:#49525F;line-height:1.55}
.lines a{color:#49525F}
.lines .addr{font-weight:700;color:var(--ink)}
.warn{display:inline-block;background:#FBE7E4;color:#9E2B1E;
  border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800}

.row{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{border:1px solid var(--line);border-radius:10px;padding:8px 11px;
  font-family:inherit;font-size:13px;min-width:0}
.row input.phone{width:170px}
.row input.track{width:190px}
.row input.memo{flex:1;min-width:170px}
.row select{border:1px solid var(--line);border-radius:10px;padding:8px 11px;
  font-family:inherit;font-size:13px;font-weight:700;background:var(--card)}
.row .wa{background:var(--green);color:#fff;border:0;border-radius:10px;padding:8px 14px;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
.row .wa.off{background:var(--wash);color:var(--muted);pointer-events:none}
.saved{font-size:12px;font-weight:700;color:var(--green);opacity:0;transition:opacity .2s}
.saved.on{opacity:1}

.st-new{color:var(--gold)} .st-packed{color:#2E6B8E}
.st-sent{color:#2E7D5F} .st-done{color:var(--muted)}

.empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.empty b{color:var(--ink)}
.note{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.7}
code{background:var(--wash);padding:2px 6px;border-radius:6px;font-size:12px}




/* ── נייר ─────────────────────────────────────────────────────
   מה שמודפס הוא מה שמסונן על המסך, לא הכול — מי שמסנן "ממתין" מדפיס
   מדבקות רק למי שעוד לא נשלח אליו. */
#print{display:none}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .bar,.wrap{display:none !important}
  #print{display:block}
  .lbl{break-inside:avoid}
}

/* גיליון תקני של 8 מדבקות ב-A4: שתי עמודות של 105 מ"מ, ארבע שורות של 74.
   אין רווח ואין שוליים — כל תא יושב בדיוק על מדבקה אחת. */
.sheet{display:grid;grid-template-columns:105mm 105mm;grid-auto-rows:74mm;gap:0}
/* 105×74 מ"מ זה הרבה נייר. שני שליש לכתובת של המזמין, שליש ל-QR ולשולח
   מתחתיו — חלוקה שנראית בלי שום קו שמפריד. */
.lbl{padding:4mm 5mm;display:grid;grid-template-columns:2fr 1fr;gap:5mm;
  break-inside:avoid;overflow:hidden}
@media screen{ .lbl{outline:1px dashed #CCC} }

/* הכל ממורכז — אופקית ואנכית, בשני הצדדים */
.lbl .body{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:0;text-align:center}
.lbl .block{min-width:0;width:100%}
.lbl .nm{font-size:27pt;font-weight:800;line-height:1.15}
.lbl .ad{font-size:20pt;line-height:1.3;margin-top:1.5mm}
.lbl .city{font-size:24pt;font-weight:800;line-height:1.25;margin-top:.5mm}
.lbl .city small{font-size:15pt;font-weight:600;color:#555;margin-inline-start:2mm}
.lbl .abroad{font-size:17pt;font-weight:700;letter-spacing:.08em}
.lbl .ph{font-size:17pt;font-weight:700;direction:ltr;unicode-bidi:isolate;
  text-align:center;margin-top:1.5mm}

.lbl .side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5mm}
.lbl .qrbox{width:32mm;height:32mm}
.lbl .qrbox .qr{display:block;width:100%;height:100%}
.lbl .sender{display:flex;flex-direction:column;align-items:center;gap:1.5mm;
  font-size:9.5pt;color:#555;line-height:1.3;text-align:center}
.lbl .sender img{width:17mm}

.rep{width:100%;border-collapse:collapse;font-size:10.5pt}
.rep caption{text-align:start;font-size:14pt;font-weight:800;padding-bottom:4mm}
.rep th{text-align:start;font-size:9.5pt;color:#555;border-bottom:1.5px solid #333;
  padding:2mm 1.5mm;font-weight:800}
.rep td{border-bottom:1px solid #DDD;padding:2.5mm 1.5mm;vertical-align:top}
.rep .box{width:7mm;height:7mm;border:1.5px solid #333;border-radius:1.5mm;display:block}
.rep tfoot td{border:0;padding-top:4mm;font-size:10pt;color:#555}
/* ── סריקה ────────────────────────────────────────────────────
   הברקוד נושא מספר בלבד; מה שנפתח אחריו הוא הדף הזה, שכבר מאחורי סיסמה.
   מי שסורק חבילה ברחוב מקבל מספר ולא שם ולא כתובת. */
.scan{position:fixed;inset:0;z-index:60;background:rgba(14,18,24,.92);
  display:flex;align-items:center;justify-content:center;padding:16px}
.scan[hidden]{display:none}
.scanBox{width:min(460px,100%);background:var(--card);border-radius:18px;overflow:hidden}
.scanTop{display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;border-bottom:1px solid var(--line)}
.scanTop b{font-size:15px;font-weight:800}
.scanTop button{background:var(--wash);border:0;border-radius:9px;padding:7px 14px;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
#cam{display:block;width:100%;height:280px;object-fit:cover;background:#111}
.scanMsg{padding:11px 16px;font-size:13.5px;color:var(--muted);min-height:20px}
.scanMsg.hit{color:var(--green);font-weight:800}
.scanManual{display:flex;gap:8px;padding:0 16px 16px}
.scanManual input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-family:inherit;font-size:14px}
.scanManual button{background:var(--ink);color:#fff;border:0;border-radius:10px;
  padding:10px 18px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.order.hit{box-shadow:0 0 0 3px var(--gold)}
</style>
</head>
<body>

<div id="gate" class="gate">
  <h2>הזמנות הספר</h2>
  <p>הזינו את סיסמת הניהול.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="סיסמה">
  <button onclick="enter()">כניסה</button>
  <div class="err" id="gateErr"></div>
</div>

<div id="app" hidden>
  <div class="bar">
    <h1>הזמנות הספר</h1>
    <span class="count" id="count"></span>
    <div class="right">
      <span class="sync" id="sync"></span>
      <button onclick="openScan()">סריקה</button>
      <button onclick="printIt('labels')">מדבקות</button>
      <button onclick="printIt('report')">דוח אריזה</button>
      <button id="syncBtn" onclick="sync()">משיכה מ-PayPal</button>
    </div>
  </div>

  <div class="wrap">
    <div class="filters" id="filters"></div>
    <div id="list"></div>
    <div class="note" id="note"></div>
  </div>
</div>

<div id="print"></div>

<div class="scan" id="scan" hidden>
  <div class="scanBox">
    <div class="scanTop">
      <b>סריקת חבילה</b>
      <button onclick="closeScan()">סגור</button>
    </div>
    <video id="cam" playsinline muted></video>
    <div class="scanMsg" id="scanMsg"></div>
    <div class="scanManual">
      <input id="scanIn" placeholder="או הקלידו מספר הזמנה" inputmode="numeric">
      <button onclick="jumpTo(document.getElementById('scanIn').value)">מצא</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ── QR ───────────────────────────────────────────────────────
   ברקוד פס הוא לסורק של חנות; אפליקציית המצלמה של האייפון קוראת QR. בתוכו
   כתובת, אז מצלמה → דפדפן → ההזמנה הנכונה, בלי אפליקציה ובלי הרשאות.

   המקודד הוא ספרייה מוכחת ולא שלי: כתבתי אחד, הוא לא פוענח במבחן, וקוד
   שמודפס על חבילה חייב להיקרא. */
function qrSVG(text, px) {
  const q = qrcode(0, 'M');          // 0 = גודל אוטומטי לפי אורך הטקסט
  q.addData(text);
  q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true })
          .replace('<svg', `<svg class="qr" width="${px}" height="${px}"`);
}

const orderURL = o => location.origin + '/orders.html#' + (o.no || 0);

/* ── ברקוד ─────────────────────────────────────────────────────
   Code 128B, מצויר כאן ולא נטען מספרייה: המדבקה חייבת להיות זהה בכל פעם
   ובכל מחשב, וגם כשאין רשת. המקודד הוא כמאה שורות והוא כל התלות.

   הברקוד נושא את מספר ההזמנה בלבד — SC-7. אין בו שם, אין בו כתובת.
   מי שסורק אותו בלי הסיסמה רואה שבע. */
const C128 = [
  '212222','222122','222221','121223','121322','131222','122213','122312','132212','221213',
  '221312','231212','112232','122132','122231','113222','123122','123221','223211','221132',
  '221231','213212','223112','312131','311222','321122','321221','312212','322112','322211',
  '212123','212321','232121','111323','131123','131321','112313','132113','132311','211313',
  '231113','231311','112133','112331','132131','113123','113321','133121','313121','211331',
  '231131','213113','213311','213131','311123','311321','331121','312113','312311','332111',
  '314111','221411','431111','111224','111422','121124','121421','141122','141221','112214',
  '112412','122114','122411','142112','142211','241211','221114','413111','241112','134111',
  '111242','121142','121241','114212','124112','124211','411212','421112','421211','212141',
  '214121','412121','111143','111341','131141','114113','114311','411113','411311','113141',
  '114131','311141','411131','211412','211214','211232','2331112',
];

function code128(text) {
  const bars = [];
  let sum = 104, i = 1;            // Start B
  bars.push(C128[104]);
  [...String(text)].forEach(ch => {
    const v = ch.charCodeAt(0) - 32;
    bars.push(C128[v]);
    sum += v * i++;
  });
  bars.push(C128[sum % 103]);      // check
  bars.push(C128[106]);            // stop
  return bars.join('');
}

/* רוחב 1 ליחידה, שחור ולבן לסירוגין */
function barcodeSVG(text, h) {
  const w = code128(text);
  let x = 0, rects = '';
  [...w].forEach((n, i) => {
    const units = Number(n);
    if (i % 2 === 0) rects += `<rect x="${x}" y="0" width="${units}" height="${h}" fill="#000"/>`;
    x += units;
  });
  return `<svg class="bc" viewBox="0 0 ${x} ${h}" preserveAspectRatio="none"
            width="100%" height="${h}">${rects}</svg>`;
}

const orderCode = o => 'SC-' + (o.no || 0);

/* PayPal מוסר כתובת כשורה אחת מופרדת בפסיקים, ובסוף קוד מדינה בן שתי
   אותיות. העיר היא מה שלפני המיקוד, והרחוב הוא כל השאר — כדי שהדוור
   יקרא את העיר בשורה משלה. */
function splitAddress(raw) {
  const parts = String(raw || '').split(',').map(x => x.trim()).filter(Boolean);
  if (!parts.length) return { street: '', city: '', zip: '', abroad: '' };

  let country = '';
  if (/^[A-Z]{2}$/.test(parts[parts.length - 1])) country = parts.pop();

  let zip = '';
  if (parts.length > 1 && /^\d{5,7}$/.test(parts[parts.length - 1])) zip = parts.pop();

  const city = parts.pop() || '';
  return {
    street: parts.join(', '),
    city, zip,
    abroad: country && country !== 'IL' ? country : '',
  };
}

/* הדף הזה לא נוגע בפאנל הניהול — הוא מדבר עם שלוש כתובות משלו בלבד. */
const STATUS = [
  { k: 'new',    he: 'ממתין' },
  { k: 'packed', he: 'נארז' },
  { k: 'sent',   he: 'נשלח' },
  { k: 'done',   he: 'נמסר' },
];
let TOKEN = '', ORDERS = [], FILTER = 'all';

const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const api = (path, body) => fetch(path, {
  method: body ? 'POST' : 'GET',
  headers: { 'x-admin-token': TOKEN, 'Content-Type': 'application/json' },
  body: body ? JSON.stringify(body) : undefined,
}).then(r => r.json());

async function enter() {
  TOKEN = document.getElementById('pw').value.trim();
  const r = await api('/api/orders').catch(() => ({}));
  if (!r || !r.success) {
    document.getElementById('gateErr').textContent = 'סיסמה שגויה';
    return;
  }
  try {
    sessionStorage.setItem('sc_orders_tok', TOKEN);
    localStorage.setItem('sab_admin', TOKEN);
  } catch (e) {}
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  paint(r);
  openFromHash();
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });

/* התאריך נקרא כמו שישראלי אומר אותו */
const when = iso => {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric' });
};

/* מספר לוואטסאפ: בלי אפס מוביל, עם 972 */
const waNum = p => {
  const d = String(p || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('972')) return d;
  return '972' + d.replace(/^0/, '');
};

function paint(r) {
  if (r) {
    ORDERS = r.orders || [];
    document.getElementById('sync').textContent =
      r.syncedAt ? 'סונכרן ' + when(r.syncedAt) : 'עוד לא סונכרן';
    document.getElementById('note').innerHTML = r.hasKeys ? '' :
      'חסרים מפתחות PayPal בשרת. הוסיפו <code>PAYPAL_CLIENT_ID</code> ו-<code>PAYPAL_SECRET</code> ואז לחצו משיכה.';
  }

  const need = ORDERS.filter(o => !o.phone).length;
  const counts = { all: ORDERS.length, nophone: need };
  STATUS.forEach(s => counts[s.k] = ORDERS.filter(o => (o.status || 'new') === s.k).length);

  document.getElementById('count').textContent =
    ORDERS.length + ' הזמנות' + (need ? ' · ' + need + ' בלי טלפון' : '');

  const tabs = [{ k: 'all', he: 'הכול' }, { k: 'nophone', he: 'בלי טלפון' }].concat(STATUS);
  document.getElementById('filters').innerHTML = tabs.map(t =>
    `<button class="${FILTER === t.k ? 'on' : ''}" onclick="setFilter('${t.k}')">
       ${t.he}<em>${counts[t.k] || 0}</em></button>`).join('');

  /* מה שדורש ממך משהו עולה למעלה, ומה שנגמר יורד. הדף הזה הוא רשימת
     מה שנשאר לעשות — נמסר רק מסתיר את מה שלא. */
  const order = { new: 0, packed: 1, sent: 2, done: 3 };
  const list = shown().sort((a, b) =>
    (order[a.status || 'new'] - order[b.status || 'new'])
    || (!a.phone === !b.phone ? 0 : a.phone ? 1 : -1)
    || String(a.at).localeCompare(String(b.at)));

  document.getElementById('list').innerHTML = list.length ? list.map(card).join('') :
    `<div class="empty">אין כאן הזמנות.<br>
       ${ORDERS.length ? 'נסו מסנן אחר.' : 'לחצו <b>משיכה מ-PayPal</b> למעלה.'}</div>`;
}

function card(o) {
  const st = o.status || 'new';
  const wa = waNum(o.phone);
  const city = (o.address || '').split(',').map(x => x.trim()).filter(Boolean).slice(-2, -1)[0] || '';
  const msg = encodeURIComponent(
    `שלום ${o.name || ''}, כאן איציק — הצופן הסודי. הספר שלך יוצא אליך בימים הקרובים.`);
  const stHe = (STATUS.find(x => x.k === st) || {}).he || '';

  return `
  <div class="order ${st === 'done' ? 'done' : ''} ${o.phone || st === 'done' ? '' : 'needPhone'}"
       data-id="${esc(o.id)}">
    <div class="head" onclick="toggle(this)">
      <span class="no">#${o.no || '—'}</span>
      <span class="who">${esc(o.name) || '—'}</span>
      <span class="city">${esc(city)}</span>
      ${o.phone ? '' : '<span class="badge bad">אין טלפון</span>'}
      ${o.printedAt ? '<span class="badge printed">מדבקה הודפסה</span>' : ''}
      <span class="sum">${o.amount} ${esc(o.currency)}</span>
      <span class="steps">${STATUS.map(x =>
        `<button class="step ${x.k === st ? 'on st-' + x.k : ''}"
                 onclick="setStatus(event,'${esc(o.id)}','${x.k}')">${x.he}</button>`).join('')}</span>
      <span class="chev">▾</span>
    </div>

    <div class="body">
      <div class="lines">
        ${o.address ? `<div class="addr">${esc(o.address)}</div>` : '<div class="warn">אין כתובת משלוח</div>'}
        <div>${when(o.at)}${o.qty > 1 ? ` · ${o.qty} עותקים` : ''}</div>
        ${o.email ? `<div><a href="mailto:${esc(o.email)}">${esc(o.email)}</a></div>` : ''}
      </div>
      <div class="row">
        <input class="phone" placeholder="טלפון" value="${esc(o.phone)}"
               oninput="edit(this,'phone')">
        <input class="track" placeholder="מספר מעקב" value="${esc(o.tracking)}"
               oninput="edit(this,'tracking')">
        <input class="memo" placeholder="הערה" value="${esc(o.memo)}"
               oninput="edit(this,'memo')">
        <a class="wa ${wa ? '' : 'off'}" target="_blank" rel="noopener"
           href="${wa ? `https://wa.me/${wa}?text=${msg}` : '#'}">וואטסאפ</a>
        <span class="saved">נשמר</span>
      </div>
    </div>
  </div>`;
}

/* שורה אחת לכל הזמנה, ומי שלוחצים עליה נפתחת. אחת בכל פעם — חמש־עשרה
   הזמנות פתוחות בבת אחת זה דף שאי אפשר לסרוק בעין. */
/* לחיצה על שלב מסמנת אותו, ולא פותחת את השורה */
window.setStatus = async function (ev, id, k) {
  ev.stopPropagation();
  const o = ORDERS.find(x => x.id === id);
  if (!o || (o.status || 'new') === k) return;
  o.status = k;
  paint();
  await api('/api/orders/update', { id, status: k }).catch(() => {});
};

window.toggle = function (btn) {
  const box = btn.closest('.order');
  const was = box.classList.contains('open');
  document.querySelectorAll('.order.open').forEach(o => o.classList.remove('open'));
  if (!was) box.classList.add('open');
};

window.setFilter = k => { FILTER = k; paint(); };

/* כל הקלדה נשמרת לבדה אחרי חצי שנייה של שקט — בלי כפתור שמירה לשכוח ללחוץ */
const timers = {};
window.edit = function (el, field) {
  const box = el.closest('.order');
  const id = box.dataset.id;
  const val = el.value;
  const mark = box.querySelector('.saved');
  clearTimeout(timers[id + field]);
  timers[id + field] = setTimeout(async () => {
    const r = await api('/api/orders/update', { id, [field]: val }).catch(() => ({}));
    if (!r.success) return;
    const o = ORDERS.find(x => x.id === id);
    if (o) o[field] = val;
    mark.classList.add('on');
    setTimeout(() => mark.classList.remove('on'), 1200);
    if (field === 'phone') box.classList.toggle('needPhone', !val);
  }, 500);
};

/* ── נייר ─────────────────────────────────────────────────────
   מודפס מה שמסונן על המסך: מסנן "ממתין" מדפיס מדבקות רק למי שעוד לא
   נשלח אליו. השולח מודפס על כל מדבקה כי חבילה בלי כתובת חוזרת שולחת
   את עצמה לפח. */
const SENDER = 'TAKTIKA · ת.ד 712, אופקים';

function shown() {
  return ORDERS.filter(o =>
    FILTER === 'all' ? true :
    FILTER === 'nophone' ? !o.phone :
    (o.status || 'new') === FILTER);
}

window.printIt = async function (what) {
  let list = shown();
  if (!list.length) return;

  /* מדבקה מודפסת פעם אחת. אחרי שהדפסת חמש־עשרה והגיעו שתיים חדשות,
     לחיצה על ״מדבקות״ מדפיסה שתיים — לא שבע־עשרה. */
  if (what === 'labels') {
    const fresh = list.filter(o => !o.printedAt);
    if (fresh.length) list = fresh;
    else if (!confirm('כל המדבקות כבר הודפסו. להדפיס את כולן שוב?')) return;
  }

  const box = document.getElementById('print');

  if (what === 'labels') {
    box.innerHTML = `<div class="sheet">${list.map(o => {
      const a = splitAddress(o.address);
      return `
      <div class="lbl">
        <div class="body">
          <div class="block to">
            <div class="nm">${esc(o.name) || '—'}</div>
            ${a.street ? `<div class="ad">${esc(a.street)}</div>` : ''}
            <div class="city">${esc(a.city) || '—'}${a.zip ? ` <small>${esc(a.zip)}</small>` : ''}</div>
            ${a.abroad ? `<div class="abroad">${esc(a.abroad)}</div>` : ''}
            ${o.phone ? `<div class="ph">${esc(o.phone)}</div>` : ''}
          </div>
        </div>

        <div class="side">
          <div class="qrbox">${qrSVG(orderURL(o), 90)}</div>
          <div class="sender">
            <img src="/marketing/logo-taktika.png" alt="">
            <span>${SENDER}</span>
          </div>
        </div>
      </div>`; }).join('')}</div>`;
  } else {
    const today = new Date().toLocaleDateString('he-IL');
    box.innerHTML = `
      <table class="rep">
        <caption>דוח אריזה · ${today} · ${list.length} הזמנות</caption>
        <thead><tr>
          <th>✓</th><th>#</th><th>שם</th><th>כתובת</th><th>טלפון</th><th>סטטוס</th><th>מעקב</th>
        </tr></thead>
        <tbody>${list.map(o => `
          <tr>
            <td><span class="box"></span></td>
            <td>${o.no || ''}</td>
            <td>${esc(o.name)}</td>
            <td>${esc(o.address)}</td>
            <td>${esc(o.phone) || '—'}</td>
            <td>${(STATUS.find(x => x.k === (o.status || 'new')) || {}).he || ''}</td>
            <td>${esc(o.tracking) || ''}</td>
          </tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="7">סה״כ ${list.reduce((n, o) => n + o.amount, 0)} ₪</td></tr></tfoot>
      </table>`;
  }
  window.print();

  if (what === 'labels') {
    const now = new Date().toISOString();
    list.forEach(o => { o.printedAt = now; });
    await Promise.all(list.map(o =>
      api('/api/orders/update', { id: o.id, printedAt: now }).catch(() => {})));
    paint();
  }
};

/* ── סריקה ────────────────────────────────────────────────────
   BarcodeDetector הוא של הדפדפן עצמו — אין ספרייה, אין שרת, התמונה לא
   עוזבת את הטלפון. איפה שהוא לא קיים, נשארת ההקלדה. */
let camStream = null, scanTimer = null;

window.openScan = async function () {
  document.getElementById('scan').hidden = false;
  const msg = document.getElementById('scanMsg');
  const video = document.getElementById('cam');

  if (!('BarcodeDetector' in window)) {
    msg.textContent = 'הדפדפן הזה לא יודע לסרוק. הקלידו את המספר למטה.';
    video.style.display = 'none';
    document.getElementById('scanIn').focus();
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia(
      { video: { facingMode: 'environment' } });
    video.srcObject = camStream;
    await video.play();
    msg.textContent = 'כוונו את המצלמה לברקוד';
  } catch (e) {
    msg.textContent = 'אין גישה למצלמה. הקלידו את המספר למטה.';
    video.style.display = 'none';
    return;
  }

  const det = new BarcodeDetector({ formats: ['code_128'] });
  scanTimer = setInterval(async () => {
    try {
      const found = await det.detect(video);
      if (found.length) jumpTo(found[0].rawValue);
    } catch (e) { /* פריים שלא נקרא — ננסה את הבא */ }
  }, 350);
};

window.closeScan = function () {
  clearInterval(scanTimer); scanTimer = null;
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  document.getElementById('cam').style.display = '';
  document.getElementById('scan').hidden = true;
};

window.jumpTo = function (raw) {
  const n = Number(String(raw).replace(/\D/g, ''));
  const o = ORDERS.find(x => x.no === n);
  const msg = document.getElementById('scanMsg');
  if (!o) { msg.className = 'scanMsg'; msg.textContent = 'לא נמצאה הזמנה ' + (n || '—'); return; }

  msg.className = 'scanMsg hit';
  msg.textContent = `#${o.no} · ${o.name}`;
  if (navigator.vibrate) navigator.vibrate(40);

  setTimeout(() => {
    closeScan();
    FILTER = 'all';
    paint();
    const box = document.querySelector(`.order[data-id="${CSS.escape(o.id)}"]`);
    if (!box) return;
    box.classList.add('open', 'hit');
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => box.classList.remove('hit'), 2400);
  }, 450);
};

document.getElementById('scanIn').addEventListener('keydown', e => {
  if (e.key === 'Enter') jumpTo(e.target.value);
});

/* מצלמת האייפון פותחת /orders.html#7 — והדף קופץ להזמנה 7 מרגע שהיא נטענה */
function openFromHash() {
  const n = Number(location.hash.replace('#', ''));
  if (n && ORDERS.length) jumpTo(n);
}
addEventListener('hashchange', openFromHash);

async function sync() {
  const b = document.getElementById('syncBtn');
  b.disabled = true; b.textContent = 'מושך…';
  const r = await api('/api/orders/sync', { days: 365 }).catch(e => ({ error: String(e) }));
  b.disabled = false; b.textContent = 'משיכה מ-PayPal';
  if (!r.success) {
    document.getElementById('note').textContent = 'PayPal החזיר שגיאה: ' + (r.error || '');
    return;
  }
  const fresh = await api('/api/orders');
  paint(fresh);
  document.getElementById('note').textContent =
    r.added ? `נוספו ${r.added} הזמנות חדשות.` : 'אין הזמנות חדשות.';
}

/* מי שכבר נכנס לפאנל הניהול באותו דפדפן — לא מקליד סיסמה שוב.
   הפאנל שומר אותה תחת sab_admin, וזה אותו מקור ואותה הרשאה. */
(async () => {
  let t = '';
  try { t = localStorage.getItem('sab_admin') || sessionStorage.getItem('sc_orders_tok') || ''; } catch (e) {}
  if (!t) return;
  TOKEN = t;
  const r = await api('/api/orders').catch(() => ({}));
  if (!r.success) return;
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  paint(r);
  openFromHash();
})();
</script>
